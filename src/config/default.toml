# Default configuration for the Polyglot Swarm.
#
# Precedence (lowest to highest): these defaults -> a user TOML file passed to
# load_settings() -> environment variables (POLYGLOT_* / GROQ_API_KEY).
# Secrets (API keys) live ONLY in the environment, never in this file.

[swarm]
# Number of agents the orchestrator spins up for a job.
agent_count = 8
# Upper bound on seam calls (translate / merge / verify) in flight at once.
# 0 means "one worker per agent", i.e. it follows agent_count.
max_concurrency = 0
# Default target language when a job does not specify one.
default_target_language = "python"

[chunking]
# Maximum source lines per translatable unit (one "chapter"). A hard bound
# under either strategy.
max_lines_per_unit = 200
# Trailing lines repeated into the next unit for join context.
overlap_lines = 0
# "structural" pulls each cut back to the nearest top-level boundary that still
# fits the budget, so functions and classes are not sliced in half; "lines"
# splits purely by count (the original behaviour).
strategy = "structural"

[ingest]
# Optional allow-list: when set, local-folder ingestion may only read paths
# inside this directory (symlinks resolved, ".." traversal rejected). Empty
# means no restriction, which is the right default for a local single-user run
# but should be set for any shared or exposed deployment.
root = ""
# Resource caps for one ingest, so a huge repository cannot exhaust memory.
max_files = 500
max_file_bytes = 1000000

[contract]
# Run the contract-first pass: one read of the whole codebase, before anything
# is translated, that fixes the target name and signature of every public
# symbol so independently-translated chapters cannot diverge on them. Turning
# this off falls back to translating each chapter in isolation.
enabled = true
# Run the closing cross-file pass: after merging, show each translated file the
# symbols its siblings actually declare and let an agent align it with them.
# Automatically skipped for single-file jobs (nothing to be inconsistent with).
reconcile = true

[verification]
# "toolchain" runs a real syntax checker per target language when one is
# installed (node --check, gofmt -e, rustc, php -l, ruby -c, tsc --noEmit),
# degrading to the structural check when it is not; "basic" never shells out.
mode = "toolchain"
# Repair rounds the verification gate may spend on one failing file before it
# gives up and fails the job. 0 disables repair (the gate becomes pass/fail).
max_repair_attempts = 1

[groq]
# Groq model each agent uses. The API key is read from the environment.
model = "llama-3.3-70b-versatile"
base_url = "https://api.groq.com/openai/v1"
temperature = 0.2
max_tokens = 8192
request_timeout_seconds = 60

[database]
# SQLite file that persists jobs, units, and results.
path = "polyglot_swarm.db"
